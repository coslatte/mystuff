server:
  # Render inyecta la variable PORT; local usa 8080
  port: ${PORT:8080}

spring:
  application:
    name: cosmiclatteweb
  datasource:
    # DB_SSLMODE=disable (local Docker) | require (Supabase)
    # IMPORTANTE: usamos las variables sueltas DB_* (no JDBC_URL). Meter el password
    # inline en una URL con caracteres especiales (& # %) rompe la conexion, por eso
    # el password va como propiedad separada DB_PASSWORD.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cosmiclatte}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # fail-fast para ver el error de password al arranque en vez de timeout largo
      initialization-fail-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Fija el dialecto para no depender de la conexion y que un error de conexion
        # salga claro (password/host) en vez del confuso "Unable to determine Dialect".
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # El schema "public" de Supabase ya viene ocupado (o de un deploy previo) sin
    # flyway_schema_history. baseline-on-migrate crea la tabla de historial y aplica
    # las migraciones (V2/V3); asume que V1 ya está aplicada porque las tablas existen.
    baseline-on-migrate: true
    # usa las mismas vars que el datasource (necesario si Flyway corre con otro usuario)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cosmiclatte}?sslmode=${DB_SSLMODE:disable}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321,http://localhost:3000}
  # Tamaño máximo por archivo de audio (bytes). ~20 MB por defecto
  upload-max-bytes: ${APP_UPLOAD_MAX_BYTES:20971520}
  # Clave de administrador enviada por header X-Admin-Key para subir/reemplazar/borrar canciones y borrar comentarios
  admin-api-key: ${ADMIN_API_KEY:changeme}
  # Supabase Storage (REST, bucket privado + URLs firmadas). El audio se guarda en Supabase,
  # ya no en disco. El frontend recibe audioUrl como URL firmada directa de Supabase.
  supabase:
    url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_STORAGE_BUCKET:music}
    # service_role key (NUNCA la anon/public). Solo va en variables del backend (.env), nunca al frontend.
    service-key: ${SUPABASE_STORAGE_SERVICE_KEY:}
    # Segundos de validez de la URL firmada que recibe el frontend
    signed-url-expiry-seconds: ${SUPABASE_SIGNED_URL_EXPIRY:3600}
