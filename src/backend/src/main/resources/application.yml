server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: cosmiclatteweb
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6543}/${DB_NAME:cosmiclatte}?sslmode=${DB_SSLMODE:require}&prepareThreshold=0&preparedStatementCacheSize=0
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6543}/${DB_NAME:cosmiclatte}?sslmode=${DB_SSLMODE:require}&prepareThreshold=0&preparedStatementCacheSize=0
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4321,http://localhost:3000}
  upload-max-bytes: ${APP_UPLOAD_MAX_BYTES:20971520}
  # Which AudioStorage implementation is active. `supabase` is the default so
  # production is unchanged by the existence of the local one. Set `local` to
  # develop without a Supabase account: files go to STORAGE_LOCAL_DIR and are
  # served from /api/local-audio by the backend itself.
  storage:
    backend: ${STORAGE_BACKEND:supabase}
    local:
      directory: ${STORAGE_LOCAL_DIR:./data/audio}
      # Left empty on purpose: the backend then uses http://localhost:<port>.
      public-base-url: ${STORAGE_LOCAL_BASE_URL:}
  admin-api-key: ${ADMIN_API_KEY:changeme}
  supabase:
    url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_STORAGE_BUCKET:music}
    service-key: ${SUPABASE_STORAGE_SERVICE_KEY:}
    signed-url-expiry-seconds: ${SUPABASE_SIGNED_URL_EXPIRY:3600}
  soundcloud:
    client-id: ${SOUNDCLOUD_CLIENT_ID:}
    user-url: ${SOUNDCLOUD_USER_URL:https://soundcloud.com/cosmiclattemusic}
  contact:
    email-enabled: ${CONTACT_EMAIL_ENABLED:false}
    telegram-enabled: ${CONTACT_TELEGRAM_ENABLED:false}
    processing-enabled: ${CONTACT_PROCESSING_ENABLED:false}
    scheduled-enabled: ${CONTACT_SCHEDULED_ENABLED:false}
    immediate-enabled: ${CONTACT_IMMEDIATE_ENABLED:true}
    gmail-client-id: ${GMAIL_CLIENT_ID:}
    gmail-client-secret: ${GMAIL_CLIENT_SECRET:}
    gmail-refresh-token: ${GMAIL_REFRESH_TOKEN:}
    from-email: ${CONTACT_FROM_EMAIL:gabrielpazruiz02@gmail.com}
    to-email: ${CONTACT_TO_EMAIL:gabrielpazruiz02@gmail.com}
    runner-token: ${CONTACT_RUNNER_TOKEN:}
    ip-hash-key: ${CONTACT_IP_HASH_KEY:}
    trust-forwarded-for: ${CONTACT_TRUST_FORWARDED_FOR:false}
    ip-limit: ${CONTACT_IP_LIMIT:3}
    daily-limit: ${CONTACT_DAILY_LIMIT:50}
    provider-url: ${CONTACT_PROVIDER_URL:https://gmail.googleapis.com/gmail/v1/users/me/messages/send}
    token-url: ${GMAIL_TOKEN_URL:https://oauth2.googleapis.com/token}
